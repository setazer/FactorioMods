open-picker=Выбрать рецепт (RecipeHelper)
panel-title=Выбор рецепта
search-toggle=Поиск
quality-label=Качество
quality-cycle-hint=Клик или Alt + колесо мыши меняют качество для всех рецептов.
nothing-found=Ничего не найдено

[controls]
rh-wheel-up=Повысить качество рецепта (пикер рецептов)
