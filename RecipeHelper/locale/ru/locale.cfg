[mod-setting-name]
rh-remember-quality=Запоминать выбранное качество
rh-show-button=Показывать кнопку в окне машины
rh-replace-pickers=Заменять ванильные пикеры рецептов
[mod-setting-description]
rh-remember-quality=Если включено, пикер рецептов запоминает последнее выбранное качество. Если выключено — всегда начинает с нормального качества.
rh-show-button=Показывает кнопку RecipeHelper в окнах крафтовых машин. Без неё пикер доступен только через логику замены ванильных пикеров.
rh-replace-pickers=Если включено, пикер RecipeHelper заменяет ванильный выбор рецепта: открывается сам при открытии крафтовой машины без заданного рецепта, а также вместо ванильного пикера, который появляется при нажатии кнопки смены рецепта в окне машины (она сбрасывает рецепт).
