[mod-setting-name]
rh-remember-quality=Remember selected quality
rh-show-button=Show button on machine GUI
rh-replace-pickers=Replace vanilla recipe pickers
[mod-setting-description]
rh-remember-quality=When enabled, the recipe picker remembers the last selected quality. When disabled, it always starts from Normal quality.
rh-show-button=Shows the RecipeHelper button on crafting machine windows. Without it the picker is only reachable through the picker-replacement logic.
rh-replace-pickers=When enabled, the RecipeHelper picker replaces the vanilla recipe chooser: it opens automatically when you open a crafting machine without a recipe set, and in place of the vanilla chooser opened by the machine's change-recipe button (which clears the recipe).
